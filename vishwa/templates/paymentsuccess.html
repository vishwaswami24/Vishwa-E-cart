{% extends 'base.html' %}

{% load static %}

{% block 'main' %}

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-6 col-md-8">
            <div class="success-card">
                <div class="success-icon-wrapper">
                    <i class="bi bi-check-circle-fill success-icon"></i>
                </div>
                <h1 class="success-title">PAYMENT SUCCESSFUL!</h1>
                <p class="success-message">Thank you for shopping with us</p>
                <p class="success-note">Your order has been placed successfully</p>
                
                <div class="success-actions">
                    <a href="/orders" class="btn-primary-custom">VIEW ORDERS</a>
                    <a href="/products" class="btn-secondary-custom">CONTINUE SHOPPING</a>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
.success-card {
    background: #fff;
    border: 1px solid #e0e0e0;
    padding: 60px 40px;
    text-align: center;
}

.success-icon-wrapper {
    margin-bottom: 30px;
}

.success-icon {
    font-size: 120px;
    color: #1a1a1a;
}

.success-title {
    font-size: 28px;
    font-weight: 600;
    letter-spacing: 3px;
    color: #1a1a1a;
    margin-bottom: 15px;
}

.success-message {
    font-size: 16px;
    color: #757575;
    margin-bottom: 10px;
}

.success-note {
    font-size: 13px;
    color: #9e9e9e;
    margin-bottom: 40px;
}

.success-actions {
    display: flex;
    flex-direction: column;
    gap: 15px;
    max-width: 300px;
    margin: 0 auto;
}

.btn-primary-custom {
    display: block;
    padding: 12px;
    background: #1a1a1a;
    color: #fff;
    text-align: center;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 1.5px;
    text-decoration: none;
    transition: all 0.3s;
}

.btn-primary-custom:hover {
    background: #000;
    color: #fff;
}

.btn-secondary-custom {
    display: block;
    padding: 12px;
    background: #fff;
    border: 1px solid #1a1a1a;
    color: #1a1a1a;
    text-align: center;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 1.5px;
    text-decoration: none;
    transition: all 0.3s;
}

.btn-secondary-custom:hover {
    background: #1a1a1a;
    color: #fff;
}

@media (max-width: 768px) {
    .success-card {
        padding: 40px 30px;
    }
    
    .success-title {
        font-size: 22px;
    }
}
</style>

{% endblock 'main' %}
