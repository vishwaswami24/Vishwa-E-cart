{% extends 'base.html' %}
{% load static %}

{% block 'main' %}
<div class="auth-container">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-5 col-md-7">
                <div class="auth-card">
                    <div class="auth-header">
                        <h1 class="auth-title">WELCOME BACK</h1>
                        <p class="auth-subtitle">Sign in to your account</p>
                    </div>
                    
                    {% if errmsg %}
                    <div class="auth-alert">
                        <i class="bi bi-exclamation-circle"></i>
                        <span>{{ errmsg }}</span>
                    </div>
                    {% endif %}
                    
                    <form method="POST" action="" class="auth-form">
                        {% csrf_token %}
                        <div class="form-group">
                            <label class="form-label">USERNAME</label>
                            <input type="text" class="form-input" name="uname" placeholder="Enter your username" required>
                        </div>
                        
                        <div class="form-group">
                            <label class="form-label">PASSWORD</label>
                            <input type="password" class="form-input" name="upass" placeholder="Enter your password" required>
                        </div>
                        
                        <button type="submit" class="auth-btn">SIGN IN</button>
                        
                        <div class="auth-footer">
                            <span>New User?</span>
                            <a href="/register" class="auth-link">Register here</a>
                        </div>
                        
                        <div class="auth-terms">
                            By continuing, you agree to our <a href="/terms">Terms</a> and <a href="/privacy">Privacy Policy</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
.auth-container {
    min-height: 100vh;
    background: #fafafa;
    display: flex;
    align-items: center;
    padding: 40px 20px;
}

.auth-card {
    background: #fff;
    border: 1px solid #e0e0e0;
    padding: 50px 40px;
}

.auth-header {
    text-align: center;
    margin-bottom: 40px;
}

.auth-title {
    font-size: 24px;
    font-weight: 600;
    letter-spacing: 3px;
    color: #1a1a1a;
    margin-bottom: 10px;
}

.auth-subtitle {
    font-size: 13px;
    color: #757575;
    margin: 0;
}

.auth-alert {
    background: #fafafa;
    border: 1px solid #e0e0e0;
    padding: 15px;
    margin-bottom: 30px;
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 12px;
    color: #757575;
}

.auth-alert i {
    font-size: 16px;
    color: #1a1a1a;
}

.auth-form {
    margin-bottom: 0;
}

.form-group {
    margin-bottom: 25px;
}

.form-label {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 1.5px;
    color: #1a1a1a;
    margin-bottom: 10px;
    display: block;
}

.form-input {
    width: 100%;
    padding: 15px;
    border: 1px solid #d0d0d0;
    font-size: 13px;
    color: #1a1a1a;
    background: #fff;
    transition: border-color 0.3s;
}

.form-input:focus {
    outline: none;
    border-color: #1a1a1a;
}

.form-input::placeholder {
    color: #9e9e9e;
}

.auth-btn {
    width: 100%;
    padding: 15px;
    background: #1a1a1a;
    color: #fff;
    border: none;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 1.5px;
    cursor: pointer;
    transition: all 0.3s;
    margin-bottom: 25px;
}

.auth-btn:hover {
    background: #000;
}

.auth-footer {
    text-align: center;
    font-size: 13px;
    color: #757575;
    margin-bottom: 20px;
}

.auth-link {
    color: #1a1a1a;
    text-decoration: none;
    font-weight: 600;
    margin-left: 5px;
}

.auth-link:hover {
    text-decoration: underline;
}

.auth-terms {
    text-align: center;
    font-size: 11px;
    color: #9e9e9e;
}

.auth-terms a {
    color: #1a1a1a;
    text-decoration: none;
}

.auth-terms a:hover {
    text-decoration: underline;
}

@media (max-width: 768px) {
    .auth-card {
        padding: 40px 30px;
    }
}
</style>
{% endblock 'main' %}
